<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2c" />
    </linearGradient>
    <linearGradient id="shieldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad512)"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#2dd4bf" stroke-width="5" stroke-dasharray="20 15" opacity="0.6"/>

  <!-- Shield Mascot Icon -->
  <g filter="url(#shadow512)" transform="translate(96, 85)">
    <path d="M160 320s106-53 106-133V66L160 26 54 66v121c0 80 106 133 106 133z" fill="url(#shieldGrad512)" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
    <!-- Inner Checkmark -->
    <path d="m120 160 26 26 54-54" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sparkle Accent -->
  <circle cx="390" cy="120" r="22" fill="#f59e0b"/>
  <path d="M390 88v64M358 120h64" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
