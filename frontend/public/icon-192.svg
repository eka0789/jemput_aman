<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2c" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="96" cy="96" r="76" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Shield Shield Mascot Icon -->
  <g filter="url(#shadow)" transform="translate(36, 32)">
    <path d="M60 120s40-20 40-50V25L60 10 20 25v45c0 30 40 50 40 50z" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
    <!-- Inner Checkmark -->
    <path d="m45 60 10 10 20-20" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sparkle Accent -->
  <circle cx="146" cy="46" r="8" fill="#f59e0b"/>
  <path d="M146 34v24M134 46h24" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>
